<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Supercleaner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="28" fill="url(#bg)"/>
  <rect x="-300" width="260" height="260" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" from="-300" to="1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g fill="#fff" opacity="0.85">
    <circle cx="90" cy="60" r="6"/><circle cx="130" cy="200" r="4"/><circle cx="800" cy="70" r="5"/>
    <circle cx="840" cy="190" r="7"/><circle cx="700" cy="215" r="3"/><circle cx="210" cy="40" r="3"/>
  </g>
  <text x="450" y="125" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#fff">🧹 Supercleaner</text>
  <text x="450" y="185" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#fff" opacity="0.95">Clean it all. Get your disk back.</text>
</svg>
